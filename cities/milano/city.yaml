# City configuration (D-013): everything city-specific lives here, never in parking_core.
id: milano
name: Milano
country: IT
timezone: Europe/Rome
locales: [it, en]
currency: EUR

sources:
  streets: municipal_dbt_2020   # official, CC BY; see cities/milano/adapter.py
  osm_relation_id: 44915       # fallback source (scripts/fetch_osm.py), not verified yet

grid:
  h3_resolution: 9          # to be confirmed by T-022 (9 vs 10)
  # Provisional bounding box; replaced by the official municipal boundary in the data pipeline.
  bbox: {south: 45.386, west: 9.040, north: 45.536, east: 9.278}

time:
  slot_minutes: 30
  day_types: [weekday, saturday, holiday]

model:
  target_minutes: 5          # "spot found within N minutes"
  prior_strength: 4.0        # pseudo-observations behind the prior
  prior_mean_default: 0.5    # used until proxies provide a per-cell prior (unvalidated, see D-015)
  half_life_days: 21         # to be validated on real outcomes
  live_window_minutes: 45    # outcomes this recent count for "now" whatever their slot
  live_weight: 3.0           # extra weight of live outcomes (to be validated)
  neighbor_weight: 0.3       # spatial shrinkage toward neighbouring cells
  max_weight_per_contributor: 3.0

vehicles:
  # Odds multipliers relative to a medium car. PROVISIONAL and unvalidated (D-023):
  # replaced by values learned city-wide from real outcomes. Motorcycles get their
  # own supply data and model later; until then this is a rough placeholder.
  default: medium
  odds: {moto: 4.0, small: 1.4, medium: 1.0, large: 0.6}

publish:
  interval_minutes: 5        # D-019

privacy:
  min_contributors: 5        # k: below this only the prior is published; never lowered (C2)
  admission_batch: 2         # C6: new contributors enter a cell only in batches of this size
  admission_interval_minutes: 30  # T-040: batches enter the grid only at these fixed clock intervals (< live window - send delay)
  send_delay_max_minutes: 10      # C7: the phone delays each send by a random 0..N minutes (device requirement)
  raw_retention_days: 30

display:
  thresholds: {high: 0.65, low: 0.35}   # provisional, on calibrated probabilities
  hysteresis: 0.05
  # Published value per class (C6: classes, never exact probabilities or counts).
  class_values: {low: 0.2, mid: 0.5, high: 0.8}
  reliability:
    high: {min_outcomes: 30, max_age_days: 7}
    medium: {min_outcomes: 10, max_age_days: 30}

# T-049: occupancy model. Every uncertain value is [central, min, max]; Monte Carlo draws use a
# triangular distribution on [min, max] with mode = central. "dato" = from a cited source,
# "ipotesi" = declared assumption, NOT validated (docs/09-modello.md, "Modello di occupazione").
capacity:
  stall_length_m: [5.0, 4.8, 5.5]       # ipotesi: parallel stall plus manoeuvring gap
  kerb_sides: [1.5, 1.0, 1.9]           # ipotesi: average sides of a street piece with parking (no width data)
  parkable_share: [0.6, 0.45, 0.75]     # ipotesi: share of usable kerb not lost to driveways, crossings, stops, bans
  junction_setback_m: 5                 # ipotesi (regola del Codice della Strada, non verificata alla fonte)
  mapped_overlap: [0.3, 0.0, 0.6]       # ipotesi: share of mapped parking areas already counted as kerb
  moto_share: [0.03, 0.01, 0.05]        # ipotesi: share of parkable kerb used by motorcycle stalls
  moto_stall_width_m: 1.0               # ipotesi
  # ipotesi (T-050): kerb share left inside the charged cordon (Area C) after tram tracks, pedestrian
  # and restricted streets, loading, taxi, car-sharing and disabled bays. No count available.
  core_capacity_factor: [0.7, 0.55, 0.85]
  # ipotesi: street-type factor by first word of the street name (default 1.0)
  name_factors: {Cavalcavia: 0.0, Superstrada: 0.0, Strada_Senza_Nome: 0.3, Alzaia: 0.5}

occupancy:
  holidays: ["01-01", "01-06", "04-25", "05-01", "06-02", "08-15", "11-01", "12-07", "12-08", "12-25", "12-26"]  # dato: national holidays + patron saint (7 Dec)
  easter_monday: true                   # dato
  on_street_share: [0.45, 0.3, 0.6]     # ipotesi: share of residents' cars kept on the street (not in private garages)
  unregistered_car_factor: [1.1, 1.0, 1.3]  # ipotesi (T-050): cars kept in the city but registered elsewhere (leasing, company cars); the 2023 ds1094 break hints at large fleets, not quantified
  goods_on_street_share: [0.5, 0.3, 0.7]    # ipotesi (T-050): share of goods vehicles (ds721, dato) kept on the street overnight
  away_peak: {weekday: [0.4, 0.25, 0.55], saturday: [0.3, 0.15, 0.45], holiday: [0.2, 0.1, 0.35]}  # ipotesi: peak share of those cars away from home
  away_hours: [7.0, 4.0, 9.0]           # ipotesi: mean time a resident's car stays away
  cordon_on_street_share: [0.3, 0.15, 0.45]  # ipotesi: share of cordon car entries ending in an on-street stay inside the cordon
  resident_attraction: [0.05, 0.02, 0.1]     # ipotesi: visitor attraction of one resident relative to one local unit
  outside_multiplier: [2.0, 1.0, 4.0]   # ipotesi: car visits per attractor outside the cordon vs inside (no charge, commuters)
  commuter_share: [0.3, 0.15, 0.5]      # ipotesi: share of visitor stays that are work days
  commuter_dwell_min: [480, 360, 540]   # ipotesi
  short_dwell_min: [75, 40, 150]        # ipotesi
  patience_min: [10, 5, 20]             # ipotesi: search time after which a driver gives up (finite-patience queue)
  draws: 40                             # Monte Carlo draws (plus the central run)
  seed: 49
  interval_pct: [5, 95]

# T-050: automatic plausibility checks printed by scripts/build_occupancy.py. Zone ids = NIL (ds964).
# Expected ranges are declared expectations (ipotesi), NOT measurements: they catch implausible
# outputs, they do not validate the model.
occupancy_checks:
  reference_zones: [1, 2, 21, 69, 20, 58, 76, 41]   # Duomo, Brera, Buenos Aires, Sarpi, Loreto-NoLo, De Angeli, Quarto Oggiaro, Gratosoglio
  centre_zones: [1, 2]                  # Duomo, Brera
  dense_residential_zones: [21, 69, 20] # Buenos Aires - P.ta Venezia, Sarpi, Loreto - Casoretto - NoLo
  periphery_zones: [76, 41]             # Quarto Oggiaro, Gratosoglio
  day_hour: 11
  city_night_occupancy: [0.6, 1.0]      # includes industrial and arterial kerb that stays empty at night
  dense_night_occupancy: [0.85, 1.0]
  centre_day_p_found: [0.0, 0.6]        # P(space within target minutes), capacity-weighted
  min_centre_periphery_gap: 0.2         # centre P must be at least this much below periphery P
