# City configuration (D-013): everything city-specific lives here, never in parking_core.
id: milano
name: Milano
country: IT
timezone: Europe/Rome
locales: [it, en]
currency: EUR

sources:
  streets: municipal_dbt_2020   # official, CC BY; see cities/milano/adapter.py
  osm_relation_id: 44915       # fallback source (scripts/fetch_osm.py), not verified yet

grid:
  h3_resolution: 9          # to be confirmed by T-022 (9 vs 10)
  # Provisional bounding box; replaced by the official municipal boundary in the data pipeline.
  bbox: {south: 45.386, west: 9.040, north: 45.536, east: 9.278}

time:
  slot_minutes: 30
  day_types: [weekday, saturday, holiday]

model:
  target_minutes: 5          # "spot found within N minutes"
  prior_strength: 4.0        # pseudo-observations behind the prior
  prior_mean_default: 0.5    # used until proxies provide a per-cell prior (unvalidated, see D-015)
  half_life_days: 21         # to be validated on real outcomes
  live_window_minutes: 45    # outcomes this recent count for "now" whatever their slot
  live_weight: 3.0           # extra weight of live outcomes (to be validated)
  neighbor_weight: 0.3       # spatial shrinkage toward neighbouring cells
  max_weight_per_contributor: 3.0

vehicles:
  # Odds multipliers relative to a medium car. PROVISIONAL and unvalidated (D-023):
  # replaced by values learned city-wide from real outcomes. Motorcycles get their
  # own supply data and model later; until then this is a rough placeholder.
  default: medium
  odds: {moto: 4.0, small: 1.4, medium: 1.0, large: 0.6}

publish:
  interval_minutes: 5        # D-019

privacy:
  min_contributors: 5        # k: below this only the prior is published; never lowered (C2)
  admission_batch: 2         # C6: new contributors enter a cell only in batches of this size
  raw_retention_days: 30

display:
  thresholds: {high: 0.65, low: 0.35}   # provisional, on calibrated probabilities
  hysteresis: 0.05
  # Published value per class (C6: classes, never exact probabilities or counts).
  class_values: {low: 0.2, mid: 0.5, high: 0.8}
  reliability:
    high: {min_outcomes: 30, max_age_days: 7}
    medium: {min_outcomes: 10, max_age_days: 30}
