name: site
# Publishes the static SostaMi web app to GitHub Pages.
# This file works once the contents of site/ are the root of the separate public repository (D-038).
# Requires: repository Settings > Pages > Source = "GitHub Actions" (done by the founder).
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
